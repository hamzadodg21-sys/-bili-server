<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Bili Server</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0a0e27;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      text-align: center;
      padding: 40px;
      background: #1a1f3a;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 { color: #6366f1; margin: 0 0 16px; }
    p { color: #aaa; margin: 8px 0; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #10b981;
      color: #000;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Bili Server</h1>
    <p>السيرفر يعمل بشكل صحيح</p>
    <p style="font-size: 13px; color: #666;">
      خدمة الملفات الثابتة جاهزة ✅
    </p>
    <span class="badge">LIVE</span>
  </div>
</body>
</html>
